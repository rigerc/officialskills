name: Update registry

on:
  schedule:
    # Every 2 days at 06:00 UTC
    - cron: "0 6 */2 * *"
  workflow_dispatch: # manual trigger
  push:
    paths:
      - src/officialskills.ts
      - src/officialskills.test.ts

# All authenticated operations use ${{ secrets.PAT }}; GITHUB_TOKEN needs only read
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: src

      - name: Run tests (catch regressions in parser/output builder)
        run: npm test
        working-directory: src

      - name: Restore URL resolution cache
        id: cache-restore
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: registry/.skills-cache.json
          key: skills-cache-v1

      - name: Generate registry files & update README
        run: npm run registry
        working-directory: src

      - name: Save URL resolution cache
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: registry/.skills-cache.json
          key: skills-cache-v1

      - name: Build commit message
        run: |
          CHANGES_FILE="registry/changes-summary.json"
          MSG_FILE="commit-msg.txt"

          if [ ! -f "$CHANGES_FILE" ]; then
            echo "Update registry ($(date -u +%Y-%m-%d))" > "$MSG_FILE"
            echo "Commit message (fallback):"
            cat "$MSG_FILE"
            exit 0
          fi

          TOTAL=$(jq -r '.total_skills // 0' "$CHANGES_FILE")
          PUBLISHERS=$(jq -r '.total_publishers // 0' "$CHANGES_FILE")
          OFFICIAL=$(jq -r '.total_official // 0' "$CHANGES_FILE")
          COMMUNITY=$(jq -r '.total_community // 0' "$CHANGES_FILE")

          DATE=$(date -u +%Y-%m-%d)
          {
            echo "Update registry ($DATE)"
            echo ""
            echo "📦 $TOTAL skills · $PUBLISHERS publishers · ${OFFICIAL} official, ${COMMUNITY} community"
          } > "$MSG_FILE"

          DIFF_AVAILABLE=$(jq -r '.diff.available // false' "$CHANGES_FILE")
          if [ "$DIFF_AVAILABLE" = "true" ]; then
            ADDED=$(jq -r '.diff.added_count // 0' "$CHANGES_FILE")
            REMOVED=$(jq -r '.diff.removed_count // 0' "$CHANGES_FILE")
            CHANGED=$(jq -r '.diff.changed_count // 0' "$CHANGES_FILE")

            # Build changes line
            CHANGES=""
            [ "$ADDED" -gt 0 ] && CHANGES="${CHANGES}+${ADDED} added "
            [ "$REMOVED" -gt 0 ] && CHANGES="${CHANGES}-${REMOVED} removed "
            [ "$CHANGED" -gt 0 ] && CHANGES="${CHANGES}~${CHANGED} URL changes"
            CHANGES="${CHANGES% }"  # trim trailing space

            if [ -n "$CHANGES" ]; then
              printf "\n📈 %s\n" "$CHANGES" >> "$MSG_FILE"
            fi

            # Add detailed lists for small change sets
            if [ "$ADDED" -gt 0 ] && [ "$ADDED" -le 10 ]; then
              printf "\nSkills added:\n" >> "$MSG_FILE"
              jq -r '.diff.added[] | "  • \(.publisher)/\(.id)"' "$CHANGES_FILE" >> "$MSG_FILE"
            fi

            if [ "$REMOVED" -gt 0 ] && [ "$REMOVED" -le 10 ]; then
              printf "\nSkills removed:\n" >> "$MSG_FILE"
              jq -r '.diff.removed[] | "  • \(.publisher)/\(.id)"' "$CHANGES_FILE" >> "$MSG_FILE"
            fi

            if [ "$CHANGED" -gt 0 ] && [ "$CHANGED" -le 10 ]; then
              printf "\nURLs changed:\n" >> "$MSG_FILE"
              jq -r '.diff.changed[] | "  • \(.id)"' "$CHANGES_FILE" >> "$MSG_FILE"
            fi
          fi

          echo "Commit message:"
          cat "$MSG_FILE"

      - name: Commit & push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add registry/official.json registry/community.json registry/manifest.json README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -F commit-msg.txt
            git push
          fi

      - name: Close stale failure issues on success
        if: success()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.PAT }}
          script: |
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automation',
            });

            for (const issue of openIssues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Registry update succeeded at ${new Date().toISOString()}. Automatically closing this issue.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              console.log(`Closed issue #${issue.number}`);
            }

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.PAT }}
          script: |
            // 1. Close any existing open automation issues (dedup)
            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automation',
            });

            for (const issue of existingIssues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `🔄 Superseded by a new failure at ${new Date().toISOString()}. Closing in favor of fresh report.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

            // 2. Fetch full error log from the failed job
            const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

            const failedJob = jobsData.jobs.find(job => job.conclusion === 'failure');
            let fullLog = '';
            let errorMessage = 'No failed job could be identified from the workflow run.';

            if (failedJob) {
              const failedSteps = (failedJob.steps || [])
                .filter(s => s.conclusion === 'failure')
                .map(s => `  • **${s.name}** (exit code: ${s.exit_code || 'N/A'})`);

              errorMessage = failedSteps.length > 0
                ? '**Failed step(s):**\n' + failedSteps.join('\n')
                : '**Failed job:** ' + failedJob.name;

              // Download raw logs
              try {
                const logResp = await github.rest.actions.downloadJobLogsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  job_id: failedJob.id,
                });
                fullLog = typeof logResp.data === 'string'
                  ? logResp.data
                  : JSON.stringify(logResp.data);
              } catch (err) {
                fullLog = `(Could not download full logs: ${err.message})`;
              }
            }

            // 3. Build the issue body
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            // Truncate logs to last 15k characters (errors typically at the end)
            const maxLen = 15000;
            const truncatedLog = fullLog.length > maxLen
              ? `... (truncated to last ${maxLen} characters; see full log at the run link below)\n` +
                fullLog.slice(-maxLen)
              : fullLog || '_(No log output captured.)_';

            const body = [
              `## ❌ Registry update failed`,
              '',
              `**Time:** ${new Date().toISOString()}`,
              `**Workflow Run:** [${runUrl}](${runUrl})`,
              `**Ref:** \`${{ github.ref }}\``,
              `**Commit:** \`${{ github.sha }}\``,
              '',
              errorMessage,
              '',
              `### Full error log`,
              '````',
              truncatedLog,
              '````',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Registry update failed (${{ github.run_id }})`,
              body: body,
              labels: ['automation'],
            });
